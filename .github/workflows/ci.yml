name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 手动触发：想立刻验证一次出包链路时用（package-windows 只在 tag / 手动时跑）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 三平台矩阵。铁律：任何 commit 不允许只有一个平台绿
  # （见 docs/PLATFORM.md §4）。
  #
  # fail-fast: false 是关键 —— 一个平台挂了不应该取消其他平台的运行，
  # 否则你永远不知道另外两个平台是不是也挂了。
  # ─────────────────────────────────────────────────────────────
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # Linux 需要 gpui 的系统库
      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 编译
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

  # ─────────────────────────────────────────────────────────────
  # 架构约束检查。这些不是风格问题，是分层破坏。
  # ─────────────────────────────────────────────────────────────
  architecture:
    name: 分层约束
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zex-core 不得依赖 IO / 异步运行时 / UI
        run: |
          set -e
          # 只看 [dependencies] 段，且跳过注释行。
          #
          # 不能整文件 grep：那个文件里 description 和提示注释本身就写着
          # "不依赖 tokio / gpui-kit"，dev-dependencies 里还有一条合法的
          # tokio（单元测试要 #[tokio::test]）。原先的写法让这个 job 从
          # M0 起就必红 —— 守门的先把自己拦在门外了。
          forbidden='tokio|reqwest|rusqlite|gpui-kit|gpui\b|hyper|sqlx'
          deps=$(awk '/^\[dependencies\]/{f=1; next} /^\[/{f=0} f' crates/zex-core/Cargo.toml \
                 | grep -Ev '^[[:space:]]*#')
          if echo "$deps" | grep -Eq "$forbidden"; then
            echo "::error::zex-core 依赖了禁止的 crate（见 docs/ARCHITECTURE.md §3）"
            echo "$deps" | grep -En "$forbidden"
            exit 1
          fi

      - name: 内核不得依赖 gpui
        run: |
          set -e
          for c in zex-agent zex-llm zex-store zex-policy zex-tools; do
            if grep -Eq 'gpui-kit' "crates/$c/Cargo.toml"; then
              echo "::error::$c 依赖了 gpui-kit，破坏内核/UI 分层（ADR-002）"
              exit 1
            fi
          done

      - name: 平台代码不得有 todo!() / unimplemented!()
        run: |
          set -e
          if grep -rnE 'todo!|unimplemented!' crates/zex-platform/src/ 2>/dev/null; then
            echo "::error::三平台代码里的 todo!() 在 Linux 上永远跑不到，在 Windows 上一跑就崩（docs/PLATFORM.md §3）"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Windows 发布包。
  #
  # 为什么在 Windows runner 上编、而不是从 Linux 交叉编译：
  # gpui-pre + wgpu(30) + windows(0.54) 这层是 D3D12/DirectComposition/COM，
  # ABI 上要走 MSVC 才稳；而且产物必须在 Windows 上做签名与安装验证，
  # 交叉编译只能省掉"一台机器"，省不掉"一次真机验证"。
  # 详见上一次讨论的结论与 docs/PLATFORM.md。
  #
  # 只在打 tag 或手动触发时跑：release 编译（gpui + wgpu 全量优化）
  # 比 check 慢一个量级，PR 上没必要每次都付这笔钱。
  # ─────────────────────────────────────────────────────────────
  package-windows:
    name: Windows 发布包
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # 三平台测试全绿才出包：一个平台挂了的版本不该有安装包
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-package

      - name: 编译（release）
        run: cargo build -p zex-app --bin zex --release

      # 单个 exe 就是完整程序：图标库和内置技能都是 include_bytes!/include_str!
      # 编进二进制的，运行期只往 ~/.zex 里写数据。所以这里不打包资源目录，
      # 少一个"装错了版本"的失败面。
      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\zex.exe dist\
          Get-Item dist\zex.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: zex-windows-x64
          path: dist/zex.exe
          if-no-files-found: error
