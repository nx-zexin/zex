[package]
name = "zex-app"
description = "Zex 组合根：GUI (zex) 与 headless (zex-cli) 两个二进制共享同一内核"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "zex"
path = "src/bin/zex.rs"

[[bin]]
name = "zex-cli"
path = "src/bin/zex_cli.rs"

[dependencies]
zex-core.workspace = true
zex-llm.workspace = true
zex-agent.workspace = true
zex-tools.workspace = true
zex-skill.workspace = true
zex-mcp.workspace = true
zex-extension.workspace = true
zex-store.workspace = true
zex-policy.workspace = true
zex-voice.workspace = true
gpui-kit.workspace = true
# 只有一件事要用它：启动时把脚本 API 的 `.d.ts` 生成到技能目录里
# （见 src/ext_typings.rs）。版本跟着 zex-extension 钉死，免得两处不一致。
gpui-shell = { version = "=0.9.1", default-features = false, features = ["quickjs"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
schemars.workspace = true
reqwest.workspace = true
image.workspace = true
notify-rust.workspace = true

# 自绘标题栏的拖动 / 最大化还原直接调 Win32（见 src/window_ops.rs）
[target.'cfg(windows)'.dependencies]
windows.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
tempfile = "3"

# Windows：把 zex.ico 嵌进 exe（资源 ID 1，gpui 窗口类图标读的就是它）
[build-dependencies]
embed-resource = "3"
