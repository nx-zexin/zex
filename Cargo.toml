[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/adam/zex"
authors = ["Adam"]

[workspace.dependencies]
# ─── 内部 crate ───
zex-core = { path = "crates/zex-core" }
zex-llm = { path = "crates/zex-llm" }
zex-store = { path = "crates/zex-store" }
zex-policy = { path = "crates/zex-policy" }
zex-agent = { path = "crates/zex-agent" }
zex-tools = { path = "crates/zex-tools" }
zex-voice = { path = "crates/zex-voice" }
zex-skill = { path = "crates/zex-skill" }
zex-mcp = { path = "crates/zex-mcp" }
zex-extension = { path = "crates/zex-extension" }

# ─── 序列化 ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# ─── 错误处理 ───
thiserror = "2"

# ─── 异步 ───
async-trait = "0.1"
# 搜索。这三个就是 ripgrep 自己的库：grep 的引擎 + 按 .gitignore 走路。
# 选它们而不是调 rg 二进制：Windows 上普通用户机器根本没有 rg，
# 而"能不能搜内容"不该取决于用户装没装一个命令行工具。
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"

# 系统剪贴板。选 arboard 而不是调 xclip/wl-paste/pbpaste：
# 那些命令在各平台名字不同、图标发行版里也不一定装了，
# 而 arboard 在 X11 / Wayland / macOS / Windows 上都自己实现。
# 自绘标题栏在 Windows 上要直接调 Win32（gpui 的 start_window_move
# 在 Windows 是空函数、zoom 不会还原）。版本跟着 gpui-pre-windows 走 0.62，
# 免得同一棵树里再多一份 windows。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# 从 gpui 的 Window 里取 HWND。gpui 用的就是这个版本。
raw-window-handle = "0.6"

arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
    "io-std",
    "net",
] }
futures = "0.3"

# ─── 网络 ───
# reqwest 0.13 的 feature 名与 0.12 不同：rustls-tls → rustls。
# 用 rustls + 系统根证书：跨平台且企业代理环境友好。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "rustls-native-certs",
    "http2",
    # 语音识别走 multipart 上传
    "multipart",
] }

# 扩展的 WebSocket 客户端。版本跟 gpui-shell 依赖的 tungstenite 0.29 对齐，
# 免得同一棵树里出现两份 tungstenite。TLS 走 rustls，和 reqwest 一致。
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }

# ─── 存储 ───
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }

# ─── 观测 ───
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-core = "0.1"

# ─── 杂项 ───
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# 图片解码。gpui-pre 本来就依赖它，这里显式声明只是为了拿 `RgbaImage`——
# 窗口图标要的是解码后的像素（见 zex-app 的 window_icon）。
# 只开 png：图标是唯一的用途，没必要把 jpeg/webp/tiff 全套 codec 编进来。
image = { version = "0.25", default-features = false, features = ["png"] }

# ─── UI ───
gpui-kit = { version = "0.9", features = ["syntect", "assets"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# 三平台代码里最危险的宏：在 Linux 上永远跑不到，在 Windows 上一跑就崩（见 docs/PLATFORM.md §3）
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"

# ─── 扩展脚本运行时（debug 构建的加速项）───
# gpui-shell 实测：不优化这两个包，debug 版脚本渲染 31.5ms，优化后 11.3ms
# （release 是 11.0ms）。quickjs-jit 本身是个门面，单独优化它没用。
[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.quickjs-jit-core]
opt-level = 3
