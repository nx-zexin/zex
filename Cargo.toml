[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/adam/zex"
authors = ["Adam"]

[workspace.dependencies]
# ─── 内部 crate ───
zex-core = { path = "crates/zex-core" }
zex-llm = { path = "crates/zex-llm" }
zex-store = { path = "crates/zex-store" }
zex-policy = { path = "crates/zex-policy" }
zex-agent = { path = "crates/zex-agent" }
zex-tools = { path = "crates/zex-tools" }
zex-platform = { path = "crates/zex-platform" }
zex-browser = { path = "crates/zex-browser" }
zex-knowledge = { path = "crates/zex-knowledge" }
zex-evolve = { path = "crates/zex-evolve" }
zex-schedule = { path = "crates/zex-schedule" }
zex-app = { path = "crates/zex-app" }
zex-voice = { path = "crates/zex-voice" }
zex-skill = { path = "crates/zex-skill" }
zex-mcp = { path = "crates/zex-mcp" }
zex-extension = { path = "crates/zex-extension" }

# ─── 序列化 ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# ─── 错误处理 ───
thiserror = "2"
anyhow = "1"

# ─── 异步 ───
async-trait = "0.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
    "io-std",
    "net",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

# ─── 网络 ───
# reqwest 0.13 的 feature 名与 0.12 不同：rustls-tls → rustls。
# 用 rustls + 系统根证书：跨平台且企业代理环境友好。
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "rustls-native-certs",
    "http2",
    # 语音识别走 multipart 上传
    "multipart",
] }

# 扩展的 WebSocket 客户端。版本跟 gpui-shell 依赖的 tungstenite 0.29 对齐，
# 免得同一棵树里出现两份 tungstenite。TLS 走 rustls，和 reqwest 一致。
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }

# ─── 存储 ───
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }

# ─── 观测 ───
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-core = "0.1"

# ─── 杂项 ───
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ─── UI ───
gpui-kit = { version = "0.9", features = ["syntect", "assets"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# 三平台代码里最危险的宏：在 Linux 上永远跑不到，在 Windows 上一跑就崩（见 docs/PLATFORM.md §3）
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"

# ─── 扩展脚本运行时（debug 构建的加速项）───
# gpui-shell 实测：不优化这两个包，debug 版脚本渲染 31.5ms，优化后 11.3ms
# （release 是 11.0ms）。quickjs-jit 本身是个门面，单独优化它没用。
[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.quickjs-jit-core]
opt-level = 3
